<section class="country-overview">
  <div class="country-overview__top">
    <app-button label="← Back" (pressed)="store.closeCountry()" />
    <h2 class="country-overview__title">{{ store.openedCountry()?.names?.common }}</h2>
  </div>

  <app-request-status
    [loading]="store.detailsLoading()"
    [error]="store.detailsError()"
    errorMessage="REST Countries API error. Failed to load country."
    (retry)="store.retryDetails()"
  >
    <dl class="country-overview__list">
      @for (row of rows(); track row.field) {
        <div class="country-overview__row">
          <dt>{{ row.field }}</dt>
          <dd>{{ row.value }}</dd>
        </div>
      }
    </dl>
  </app-request-status>
</section>
