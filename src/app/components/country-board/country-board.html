<section class="country-board">
  <app-request-status
    [loading]="store.loading()"
    [error]="!!store.error()"
    errorMessage="REST Countries API error. Failed to load countries."
    (retry)="store.retry()"
  >
    <div class="country-board__grid">
      @for (country of store.countries(); track country.uuid) {
        <app-country-card [country]="country" (opened)="store.openCountry(country)" />
      }
    </div>
    <app-country-pagination />
  </app-request-status>
</section>
