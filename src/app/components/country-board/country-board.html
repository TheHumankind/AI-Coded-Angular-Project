<section class="country-board">
  @if (store.loading()) {
    <p class="country-board__status">Loading…</p>
  } @else if (store.error()) {
    <div class="country-board__status">
      <p class="country-board__message">REST Countries API error. Failed to load countries.</p>
      <button class="country-board__retry" type="button" (click)="store.retry()">Try again</button>
    </div>
  } @else {
    <div class="country-board__grid">
      @for (country of store.countries(); track country.uuid) {
        <app-country-card [country]="country" />
      }
    </div>
  }
</section>
